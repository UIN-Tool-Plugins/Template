name: Build Plugins

on:
  push:
    paths:
      - 'plugins/**'
      - 'source.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Build changed plugins
        run: |
          mkdir -p build

          # 增量: 本次推送改动的插件
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- plugins/ 2>/dev/null | cut -d'/' -f2 | sort -u)

          # 无改动则构建全部
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -d plugins/*/ 2>/dev/null | xargs -I{} basename {})
          fi

          echo "📦 Plugins to build: $CHANGED"

          SUCCESS=0
          FAIL=0

          for plugin_id in $CHANGED; do
            PLUGIN_DIR="plugins/$plugin_id"
            [ -d "$PLUGIN_DIR" ] || continue

            if bash scripts/build-plugin.sh "$PLUGIN_DIR" "build/$plugin_id.tpk"; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
              echo "❌ Failed: $plugin_id"
            fi
          done

          echo "✅ Built: $SUCCESS, ❌ Failed: $FAIL"

      - name: Deploy to dist branch
        run: |
          # 保存构建产物
          cp -r build /tmp/build_backup

          # 检出 dist 分支到单独目录
          rm -rf /tmp/dist_repo
          git clone --branch dist --single-branch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git /tmp/dist_repo 2>/dev/null || {
            git clone --branch main --single-branch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git /tmp/dist_repo
            cd /tmp/dist_repo
            git checkout --orphan dist
            git rm -rf .
            cd -
          }

          cd /tmp/dist_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 复制构建产物
          for tpk in /tmp/build_backup/*.tpk; do
            [ -f "$tpk" ] || continue
            PLUGIN_ID=$(basename "$tpk" .tpk)
            DIST_DIR="plugins/$PLUGIN_ID"
            mkdir -p "$DIST_DIR"
            rm -f "$DIST_DIR"/*.tpk
            cp "$tpk" "$DIST_DIR/"

            # 写入版本号和时间戳
            PLUGIN_JSON="$GITHUB_WORKSPACE/plugins/$PLUGIN_ID/plugin.json"
            if [ -f "$PLUGIN_JSON" ]; then
              jq -r '.version' "$PLUGIN_JSON" > "$DIST_DIR/.version"
            fi
            date -u +%Y-%m-%dT%H:%M:%SZ > "$DIST_DIR/.built"
          done

          # 复制 scripts 和 assets（generate-index.sh 需要）
          cp -r "$GITHUB_WORKSPACE/scripts" .
          cp -r "$GITHUB_WORKSPACE/assets" . 2>/dev/null || true

          # 生成 source.json
          bash scripts/generate-index.sh .

          # 清理不需要的文件
          rm -rf scripts assets node_modules

          # 提交并推送
          git add -A
          git diff --staged --quiet || git commit -m "build: update plugins [skip ci]"
          git push origin dist
