name: Build Plugins
# 运行名固定成短标题；默认会取 commit 首行，插件多时会被撑长。
run-name: "Build plugins #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'source.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同一个仓库的 dist 只能有一个发布者，避免两个 job 同时 push 互相覆盖。
concurrency:
  group: plugin-dist-${{ github.repository }}
  cancel-in-progress: false

env:
  # 模板插件全部签名：正式发布需配置 Secrets（PLUGIN_KEYSTORE_BASE64 等）。
  # fork 后若无密钥可暂时改回 '0' 跑通流程，但发布产物必须签名。
  REQUIRE_SIGNING: '1'
  ANDROID_PLATFORM: '34'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_KEYSTORE_BASE64: ${{ secrets.PLUGIN_KEYSTORE_BASE64 }}
      PLUGIN_STORE_PASSWORD: ${{ secrets.PLUGIN_STORE_PASSWORD }}
      PLUGIN_KEY_PASSWORD: ${{ secrets.PLUGIN_KEY_PASSWORD }}
      PLUGIN_KEY_ALIAS: ${{ secrets.PLUGIN_KEY_ALIAS }}
      PLUGIN_CERT_SHA256: ${{ secrets.PLUGIN_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null
          ls -d "$ANDROID_HOME/platforms/android-${ANDROID_PLATFORM}" "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Install aarch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1

      - name: Verify host-sdk
        run: bash scripts/check-host-sdk.sh

      - name: Fetch dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/dist_repo
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" dist >/dev/null 2>&1; then
            git clone --depth 1 --branch dist "$REMOTE" /tmp/dist_repo
          else
            mkdir -p /tmp/dist_repo
            git -C /tmp/dist_repo init -q
            git -C /tmp/dist_repo remote add origin "$REMOTE"
            git -C /tmp/dist_repo checkout -q --orphan dist
          fi
          git -C /tmp/dist_repo config user.name "github-actions[bot]"
          git -C /tmp/dist_repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Plan build
        run: |
          mkdir -p build
          bash scripts/changed-plugins.sh "${{ github.event.before }}" "${{ github.sha }}" > build/plan.txt
          count=$(wc -l < build/plan.txt | tr -d ' ')
          echo "本次构建插件：${count} 个"
          cat build/plan.txt

      - name: Build plugins
        run: |
          if [ ! -s build/plan.txt ]; then
            echo "没有需要重新构建的插件，只更新索引"
            exit 0
          fi
          while IFS= read -r plugin_id; do
            [ -n "$plugin_id" ] || continue
            [ -d "plugins/$plugin_id" ] || continue
            prev=$(cat "/tmp/dist_repo/plugins/$plugin_id/.version" 2>/dev/null || echo 0)
            bash scripts/build-plugin.sh "plugins/$plugin_id" "build/$plugin_id.tpk" "$prev"
          done < build/plan.txt

      - name: Verify built packages
        run: |
          shopt -s nullglob
          files=(build/*.tpk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次没有构建产物"
            exit 0
          fi
          for tpk in "${files[@]}"; do
            python3 scripts/tpk.py verify --tpk "$tpk" --require-signature
          done

      - name: Deploy to dist
        run: bash scripts/deploy-dist.sh /tmp/dist_repo build source.json

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ github.run_number }}
          path: |
            build/*.tpk
            build/meta/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## 插件构建"
            echo ""
            echo "- 提交：${{ github.sha }}"
            echo "- 触发：${{ github.event_name }}"
            echo ""
            python3 scripts/tpk.py summary --meta-dir build/meta
          } >> "$GITHUB_STEP_SUMMARY"
